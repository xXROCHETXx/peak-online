<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Abre PEAK directamente en el navegador.">
  <title>PEAK</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#eee;font:14px/1.5 system-ui,sans-serif}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    #boot-status{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:#000}
    #entry-error{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px}
    a{color:#b0d966}[hidden]{display:none!important}
  </style>
  <script type="module" src="entry.mjs"></script>
</head>
<body>
  <iframe id="peak-game" title="PEAK" allow="microphone; fullscreen; autoplay; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <p id="boot-status" role="status">Cargando PEAK…</p>
  <div id="entry-error" hidden><h1>No se pudo abrir la invitación</h1><p id="entry-message" role="alert"></p><a href="./index.html">Abrir PEAK</a></div>
  <noscript>Activa JavaScript para jugar a PEAK.</noscript>
</body>
</html>
